on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - "[0-9].x"

name: Continuous integration

jobs:
  ci:
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            os: ubuntu-latest
          - rust: beta
            os: ubuntu-latest
          # Without an explicit --target, RUSTFLAGS also reaches proc-macro
          # crates, which rustc rejects with sanitizers enabled. --target
          # splits the build graph so only target units see -Z sanitizer.
          - rust: nightly
            os: ubuntu-latest
            rustflags: "-Z sanitizer=leak"
            target: x86_64-unknown-linux-gnu
          - rust: stable
            os: windows-latest
          - rust: nightly
            os: windows-latest
          - rust: stable-x86_64-pc-windows-gnu
            os: windows-latest
          # An i686 host toolchain cannot run on x86_64 runners; install the
          # stable host toolchain and add the i686 target instead.
          - rust: stable-i686-pc-windows-msvc
            os: windows-latest
            toolchain: stable
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install rustup if needed
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
          fi
        if: runner.os != 'Windows'
        shell: bash

      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.toolchain || matrix.rust }} --profile minimal --no-self-update
        shell: bash

      - name: Default to nightly if requested
        run: rustup default nightly
        if: matrix.rust == 'nightly'

      - name: Add extra compilation target
        run: rustup target add ${{ matrix.target }}
        if: matrix.target
        shell: bash

      - name: Build pg_query
        run: cargo build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Run tests
        run: cargo test ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  check_style:
    name: Check file formatting and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install rustup if needed
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
          fi
        if: runner.os != 'Windows'
        shell: bash

      - name: Install toolchain
        run: rustup toolchain install stable --component clippy --component rustfmt --profile minimal --no-self-update
        shell: bash

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: clippy-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check file formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy
